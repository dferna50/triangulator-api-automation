stages:
  - validate
  - test
  - report

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  HYPOTHESIS_PROFILE: "ci"

cache:
  paths:
    - .cache/pip
    - venv/

# Token validation stage - runs first to fail fast
validate_token:
  stage: validate
  image: python:3.12
  script:
    - echo "Installing dependencies for token validation..."
    - pip install requests
    - echo "Validating access token..."
    - python token_manager.py
  only:
    - branches
    - merge_requests
    - schedules
  tags:
    - docker

# Smoke tests - quick validation
smoke_tests:
  stage: test
  image: python:3.12
  needs: ["validate_token"]
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Running smoke tests..."
    - pytest -v -m smoke --tb=short --junitxml=report-smoke.xml
  artifacts:
    when: always
    reports:
      junit: report-smoke.xml
    paths:
      - report-smoke.xml
    expire_in: 30 days
  only:
    - branches
    - merge_requests
  tags:
    - docker

# Full test suite
full_tests:
  stage: test
  image: python:3.12
  needs: ["smoke_tests"]
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - echo "Running full test suite..."
    - pytest -v --tb=short --maxfail=10 --junitxml=report-full.xml
  artifacts:
    when: always
    reports:
      junit: report-full.xml
    paths:
      - report-full.xml
      - .pytest_cache/
    expire_in: 30 days
  only:
    - branches
    - merge_requests
  tags:
    - docker

# Weekly token health check
scheduled_token_check:
  stage: validate
  image: python:3.12
  script:
    - pip install requests
    - python token_manager.py
    - |
      if [ $? -ne 0 ]; then
        echo "ERROR: Access token is expired or invalid!"
        echo "Action Required: Update ACCESS_TOKEN variable in GitLab CI/CD settings"
        exit 1
      fi
  only:
    - schedules
  allow_failure: false
  tags:
    - docker

# Generate test report summary
test_report:
  stage: report
  image: python:3.12
  needs: ["full_tests"]
  when: always
  script:
    - echo "Test execution completed"
    - echo "Check artifacts for detailed results"
  artifacts:
    paths:
      - report-*.xml
    expire_in: 90 days
  only:
    - branches
    - merge_requests
  tags:
    - docker
