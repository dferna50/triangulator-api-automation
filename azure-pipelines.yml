trigger:
  branches:
    include:
    - main
    - develop
  paths:
    exclude:
    - README.md
    - docs/*

pr:
  branches:
    include:
    - main
    - develop

schedules:
# Run daily at 2 AM UTC to catch token expiration issues early
- cron: "0 2 * * *"
  displayName: Daily Token Health Check
  branches:
    include:
    - main
  always: true

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'
  HYPOTHESIS_PROFILE: 'ci'

stages:
- stage: ValidateToken
  displayName: 'Validate Access Token'
  jobs:
  - job: TokenValidation
    displayName: 'Check Token Status'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'
    
    - script: |
        python -m pip install --upgrade pip
        pip install requests
      displayName: 'Install dependencies'
    
    - script: |
        python token_manager.py
      env:
        BASE_URL: $(BASE_URL)
        ACCESS_TOKEN: $(ACCESS_TOKEN)
      displayName: 'Validate Access Token'
      continueOnError: false

- stage: Test
  displayName: 'Run API Tests'
  dependsOn: ValidateToken
  condition: succeeded()
  jobs:
  - job: APITests
    displayName: 'Execute Test Suite'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
      displayName: 'Use Python $(pythonVersion)'
    
    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install all dependencies'
    
    - script: |
        pytest -v -m smoke --tb=short --junitxml=junit/smoke-test-results.xml
      env:
        BASE_URL: $(BASE_URL)
        ACCESS_TOKEN: $(ACCESS_TOKEN)
        HYPOTHESIS_PROFILE: $(HYPOTHESIS_PROFILE)
      displayName: 'Run Smoke Tests'
      continueOnError: true
    
    - script: |
        pytest -v --tb=short --maxfail=10 --junitxml=junit/test-results.xml
      env:
        BASE_URL: $(BASE_URL)
        ACCESS_TOKEN: $(ACCESS_TOKEN)
        HYPOTHESIS_PROFILE: $(HYPOTHESIS_PROFILE)
      displayName: 'Run All Tests'
      continueOnError: true
    
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results.xml'
        searchFolder: '$(System.DefaultWorkingDirectory)/junit'
        mergeTestResults: true
        failTaskOnFailedTests: true
        testRunTitle: 'API Automation Tests'
      displayName: 'Publish Test Results'
    
    - task: PublishBuildArtifacts@1
      condition: always()
      inputs:
        pathToPublish: 'junit'
        artifactName: 'test-results'
      displayName: 'Upload Test Artifacts'
