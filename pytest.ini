[pytest]
# Pytest configuration for Schemathesis tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -q

# Markers
markers =
    security: Security-related tests
    property: Property-based tests
    stateful: Stateful workflow tests
    slow: Slow-running tests
    integration: Integration tests
    smoke: Smoke tests
    regression: Regression tests
    data_validation: Data validation tests
    resilience: Resilience and error recovery tests
    observability: Monitoring and observability tests
    performance: Performance and load tests
    client_report: Individual tests for client reporting (1:1 Excel mapping)

# Test paths
testpaths = .

# Logging (disabled for speed - enable with --log-cli if needed)
log_cli = false
log_cli_level = WARNING
log_cli_format = %(levelname)s: %(message)s

# Coverage (if using pytest-cov)
# [coverage:run]
# source = .
# omit = 
#     */tests/*
#     */test_*

# Hypothesis settings
hypothesis_profile = default
