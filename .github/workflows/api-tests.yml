name: API Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC to catch token expiration issues early
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate Access Token
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      run: |
        echo "Validating API access token..."
        python token_manager.py
        if [ $? -ne 0 ]; then
          echo "::error::Access token validation failed! Update the ACCESS_TOKEN secret in GitHub."
          exit 1
        fi
    
    - name: Run Tests
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        HYPOTHESIS_PROFILE: ci
      run: |
        pytest -v --tb=short --maxfail=20  --html=pytest-report.html --self-contained-html 
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          pytest-report.html
          .pytest_cache/
        retention-days: 30
    
    - name: Notify on Token Expiration
      if: failure()
      run: |
        echo "::warning::Tests failed - check if ACCESS_TOKEN needs rotation"
