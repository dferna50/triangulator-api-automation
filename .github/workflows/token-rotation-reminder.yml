name: Token Rotation Reminder

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-token:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Check Token Status
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      run: |
        python token_manager.py
        TOKEN_STATUS=$?
        
        if [ $TOKEN_STATUS -ne 0 ]; then
          echo "::error::ACCESS_TOKEN is expired or invalid!"
          echo "::error::Action Required: Rotate the token in GitHub Secrets"
          exit 1
        else
          echo "::notice::Token is valid - next check in 7 days"
        fi
    
    - name: Create Issue on Token Failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = '🔐 Action Required: API Access Token Expired';
          const body = `## Token Rotation Required
          
          The API access token has expired or become invalid.
          
          ### Action Steps:
          1. Generate a new access token from the API provider
          2. Update the \`ACCESS_TOKEN\` secret in repository settings:
             - Go to Settings → Secrets and variables → Actions
             - Update the \`ACCESS_TOKEN\` secret with the new value
          3. Re-run the failed workflow to verify
          
          ### Automation Impact:
          - ⚠️ All automated tests are currently failing
          - ⚠️ CI/CD pipeline is blocked
          
          **Priority:** High
          **Due Date:** Within 24 hours
          
          ---
          _Auto-generated by token-rotation-reminder workflow_`;
          
          // Check if issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'token-rotation'
          });
          
          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['token-rotation', 'priority-high', 'automation']
            });
          }
